<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1145"/>
      <stop offset="50%" style="stop-color:#12082b"/>
      <stop offset="100%" style="stop-color:#080318"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="tileS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="tileG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Tam dolgu zemin (maskable için) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Işıma efekti (güvenli alan içinde) -->
  <circle cx="256" cy="235" r="150" fill="#7c3aed" opacity="0.2"/>

  <!-- 3D Taş 1: B (Yeşil) -->
  <g transform="translate(85, 160) rotate(-4)" filter="url(#shadow)">
    <rect x="0" y="8" width="100" height="120" rx="22" fill="#064e3b"/>
    <rect x="0" y="0" width="100" height="114" rx="22" fill="url(#tileB)"/>
    <path d="M 12 6 Q 50 2 88 6" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <text x="50" y="70" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="58" fill="#ffffff">B</text>
  </g>

  <!-- 3D Taş 2: S (Altın Sarı) -->
  <g transform="translate(206, 148)" filter="url(#shadow)">
    <rect x="0" y="8" width="100" height="120" rx="22" fill="#78350f"/>
    <rect x="0" y="0" width="100" height="114" rx="22" fill="url(#tileS)"/>
    <path d="M 12 6 Q 50 2 88 6" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <text x="50" y="70" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="58" fill="#1e1b4b">S</text>
  </g>

  <!-- 3D Taş 3: G (Mor / İndigo) -->
  <g transform="translate(327, 160) rotate(4)" filter="url(#shadow)">
    <rect x="0" y="8" width="100" height="120" rx="22" fill="#312e81"/>
    <rect x="0" y="0" width="100" height="114" rx="22" fill="url(#tileG)"/>
    <path d="M 12 6 Q 50 2 88 6" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <text x="50" y="70" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="58" fill="#ffffff">G</text>
  </g>

  <!-- Güvenli alanda LİNGO yazısı -->
  <text x="256" y="348" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="6">LİNGO</text>

  <!-- manifest.test.ts uyumluluğu için -->
  <text x="256" y="256" opacity="0.001" font-size="1">BSG</text>
</svg>
