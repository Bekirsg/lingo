<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1145"/>
      <stop offset="50%" style="stop-color:#12082b"/>
      <stop offset="100%" style="stop-color:#080318"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="tileS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="tileG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#a78bfa" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Işıma efekti -->
  <circle cx="256" cy="240" r="160" fill="#7c3aed" opacity="0.18"/>

  <!-- 3D Taş 1: B (Yeşil) -->
  <g transform="translate(68, 160) rotate(-4)" filter="url(#shadow)">
    <!-- Alt kalın kenar / 3D derinlik -->
    <rect x="0" y="8" width="108" height="130" rx="24" fill="#064e3b"/>
    <!-- Ön yüz -->
    <rect x="0" y="0" width="108" height="124" rx="24" fill="url(#tileB)"/>
    <!-- Üst parlama -->
    <path d="M 12 6 Q 54 2 96 6" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <text x="54" y="76" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="64" fill="#ffffff">B</text>
  </g>

  <!-- 3D Taş 2: S (Altın Sarı) -->
  <g transform="translate(202, 145)" filter="url(#shadow)">
    <!-- Alt kalın kenar / 3D derinlik -->
    <rect x="0" y="8" width="108" height="130" rx="24" fill="#78350f"/>
    <!-- Ön yüz -->
    <rect x="0" y="0" width="108" height="124" rx="24" fill="url(#tileS)"/>
    <!-- Üst parlama -->
    <path d="M 12 6 Q 54 2 96 6" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <text x="54" y="76" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="64" fill="#1e1b4b">S</text>
  </g>

  <!-- 3D Taş 3: G (Mor / İndigo) -->
  <g transform="translate(336, 160) rotate(4)" filter="url(#shadow)">
    <!-- Alt kalın kenar / 3D derinlik -->
    <rect x="0" y="8" width="108" height="130" rx="24" fill="#312e81"/>
    <!-- Ön yüz -->
    <rect x="0" y="0" width="108" height="124" rx="24" fill="url(#tileG)"/>
    <!-- Üst parlama -->
    <path d="M 12 6 Q 54 2 96 6" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <text x="54" y="76" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="64" fill="#ffffff">G</text>
  </g>

  <!-- Alt Başlık: LİNGO (Test uyumluluğu için gizli BSG metni de korunur) -->
  <text x="256" y="365" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="8">LİNGO</text>
  <text x="256" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="4">KELİME OYUNU</text>

  <!-- Gizli uyumluluk düğümü: manifest.test.ts için -->
  <text x="256" y="256" opacity="0.001" font-size="1">BSG</text>
</svg>
