<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a3e"/>
      <stop offset="100%" style="stop-color:#0f0a2e"/>
    </linearGradient>
  </defs>
  <!-- Tam dolgu zemin (maskable ikonlar için yuvarlak köşe yok; OS kendi maskesini uygular) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Güvenli alan (%80 iç daire, r=204.8px) içine tam ortalanmış net BSG logosu -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central" font-family="Arial Black, Arial, -apple-system, sans-serif" font-weight="900" font-size="135" fill="#a78bfa" letter-spacing="2">BSG</text>
</svg>
